apply plugin: "com.android.application"

def repoRoot = rootProject.file("..")
def moduleRoot = new File(repoRoot, "snolc-modules")
def sdkRoot = System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME")
if (sdkRoot == null) {
    throw new GradleException("ANDROID_SDK_ROOT or ANDROID_HOME is required")
}
def ndkRoot = new File(sdkRoot, "ndk/29.0.14206865")
def toolchain = new File(ndkRoot, "toolchains/llvm/prebuilt/linux-x86_64/bin")
def releaseSigning = [
    store: System.getenv("SNOLC_ANDROID_KEYSTORE"),
    storePassword: System.getenv("SNOLC_ANDROID_STORE_PASSWORD"),
    alias: System.getenv("SNOLC_ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("SNOLC_ANDROID_KEY_PASSWORD"),
]
def releaseSigningConfigured = releaseSigning.values().every { it != null && !it.isEmpty() }
android {
    namespace = "org.owenewans.snolc"
    compileSdk = 36
    buildToolsVersion = "36.0.0"
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = "org.owenewans.snolc"
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = "0.0.2"
        ndk {
            abiFilters += ["arm64-v8a", "armeabi-v7a"]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [layout.buildDirectory.dir("generated/jniLibs")]
            assets.srcDirs = [layout.buildDirectory.dir("generated/assets")]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseSigning.store)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.alias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (buildsRelease && !releaseSigningConfigured) {
        throw new GradleException("release signing environment is incomplete")
    }
}

def rustEnvironment = { String target, String clangPrefix ->
    return [
        ("CC_${target.replace('-', '_')}".toString()): new File(toolchain, "${clangPrefix}24-clang"),
        ("CXX_${target.replace('-', '_')}".toString()): new File(toolchain, "${clangPrefix}24-clang++"),
        ("AR_${target.replace('-', '_')}".toString()): new File(toolchain, "llvm-ar"),
        ("CARGO_TARGET_${target.replace('-', '_').toUpperCase()}_LINKER".toString()): new File(toolchain, "${clangPrefix}24-clang"),
        "ANDROID_NDK_HOME": ndkRoot,
    ]
}

def registerRustBuild = { String suffix, String target, String abi, String clangPrefix ->
    def modulesTask = tasks.register("cargoModules${suffix}", Exec) {
        workingDir moduleRoot
        def arguments = ["build", "--release", "--locked", "--target", target, "--workspace", "--exclude", "snolc-module-tests"]
        commandLine "cargo", *arguments
        environment rustEnvironment(target, clangPrefix)
    }
    tasks.register("cargo${suffix}", Exec) {
        dependsOn modulesTask
        workingDir repoRoot
        commandLine "cargo", "build", "--release", "--locked", "--target", target
        environment rustEnvironment(target, clangPrefix)
        doLast {
            copy {
                from new File(repoRoot, "target/${target}/release")
                into layout.buildDirectory.dir("generated/jniLibs/${abi}")
                include "libsnolc_ng.so"
            }
            copy {
                from new File(moduleRoot, "target/${target}/release")
                into layout.buildDirectory.dir("generated/jniLibs/${abi}")
                include "libsnolc_*.so"
            }
        }
    }
}

registerRustBuild("Arm64", "aarch64-linux-android", "arm64-v8a", "aarch64-linux-android")
registerRustBuild("Armv7", "armv7-linux-androideabi", "armeabi-v7a", "armv7a-linux-androideabi")

tasks.register("generateNotices", Exec) {
    workingDir repoRoot
    def assets = layout.buildDirectory.dir("generated/assets")
    inputs.files(new File(repoRoot, "Cargo.toml"), new File(repoRoot, "Cargo.lock"))
    outputs.files(assets.map { it.file("LICENSE") }, assets.map { it.file("THIRD_PARTY_NOTICES.txt") })
    commandLine "python", new File(repoRoot, "tools/notices.py"),
        "--output", assets.map { it.file("THIRD_PARTY_NOTICES.txt") }.get().asFile
    doLast {
        copy {
            from new File(repoRoot, "LICENSE")
            into assets
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("cargoArm64", "cargoArmv7", "generateNotices")
}
