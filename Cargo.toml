[package]
name = "snolc-ng"
description = "desktop and Android client for snolc"
version = "0.0.2"
edition = "2024"
rust-version = "1.98.1"
authors = ["Owen Ewans <owenewans@tuta.io>"]
license = "Unlicense"
repository = "https://github.com/owenewans/snolcNG"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["gui"]
gui = [
  "dep:egui",
  "dep:egui-winit",
  "dep:egui_glow",
  "dep:glow",
  "dep:glutin",
  "dep:glutin-winit",
  "dep:jni",
  "dep:libc",
  "dep:winit",
]

[dependencies]
base64 = "=0.22.1"
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"], optional = true }
egui_glow = { version = "=0.36.2", default-features = false, features = ["winit"], optional = true }
glow = { version = "=0.17.0", optional = true }
glutin = { version = "=0.32.3", optional = true }
glutin-winit = { version = "=0.5.0", optional = true }
getrandom = "=0.3.4"
libc = { version = "=0.2.189", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
snolc = { version = "=0.0.2", git = "https://github.com/owenewans/snolc.git", rev = "c07d04a1f4957916c790edbafd122bb2756a9d50" }
thiserror = "=2.0.20"
toml = "=1.1.6"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"], optional = true }
zeroize = "=1.9.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
egui-winit = { version = "=0.36.2", default-features = false, optional = true, features = ["clipboard", "links", "wayland", "x11"] }
winit = { version = "=0.30.13", default-features = false, optional = true, features = ["wayland", "wayland-dlopen", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
egui-winit = { version = "=0.36.2", default-features = false, optional = true, features = ["android-native-activity"] }
jni = { version = "=0.22.4", optional = true }
winit = { version = "=0.30.13", default-features = false, optional = true, features = ["android-native-activity"] }

[[bin]]
name = "snolcNG"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
