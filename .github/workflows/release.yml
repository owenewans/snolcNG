name: release targets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install --yes libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x86_64-unknown-linux-gnu
          path: target/release/snolcNG
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: install signing key
        env:
          KEYSTORE_B64: ${{ secrets.SNOLC_ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
      - working-directory: android
        env:
          SNOLC_ANDROID_KEYSTORE: ${{ runner.temp }}/android-release.jks
          SNOLC_ANDROID_STORE_PASSWORD: ${{ secrets.SNOLC_ANDROID_STORE_PASSWORD }}
          SNOLC_ANDROID_KEY_ALIAS: ${{ secrets.SNOLC_ANDROID_KEY_ALIAS }}
          SNOLC_ANDROID_KEY_PASSWORD: ${{ secrets.SNOLC_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: verify libraries
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test "$(unzip -Z1 "$apk" | grep -c '^lib/.*/libsnolc_.*\.so$')" -eq 22
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
