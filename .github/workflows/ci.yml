name: ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true
      - name: install system libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: notices
        run: python tools/notices.py --output /tmp/THIRD_PARTY_NOTICES.txt
      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true
      - name: install Android packages
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: verify APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test "$(unzip -Z1 "$apk" | grep -c '^lib/.*/libsnolc_.*\.so$')" -eq 22
          unzip -p "$apk" assets/LICENSE | grep -q 'This is free and unencumbered software'
          unzip -p "$apk" assets/THIRD_PARTY_NOTICES.txt | grep -q 'snolc third-party notices'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snolcNG-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: rustup toolchain install nightly-2026-09-16 --profile minimal
      - run: cargo +1.98.1 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-09-16 metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 >/dev/null
      - working-directory: fuzz
        run: cargo +nightly-2026-09-16 fuzz run profile-uri -- -max_total_time=10 -rss_limit_mb=4096 -max_len=131072
